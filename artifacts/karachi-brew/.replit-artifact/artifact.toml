kind = "web"
previewPath = "/"
title = "Karachi Brew Café"
version = "1.0.0"
id = "artifacts/karachi-brew"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20116

[services.development]
run = "pnpm --filter @workspace/karachi-brew run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/karachi-brew", "run", "build" ]
serve = "static"
publicDir = "artifacts/karachi-brew/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20116"
BASE_PATH = "/"
